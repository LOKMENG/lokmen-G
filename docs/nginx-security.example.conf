# =====================================================================
#  قواعد حماية nginx — لمن يستضيف المنصة على خادم nginx بدل Apache
#  تُدرج داخل كتلة server {} الخاصة بالموقع
# =====================================================================

# 1) منع عرض محتويات المجلدات
autoindex off;

# 2) حجب الملفات والمجلدات الداخلية
location ~* /\.(?!well-known/) {
    deny all;
    access_log off;
    log_not_found off;
}

location ~* ^/(config|src|includes|views|storage|tests|tools|docs)/ {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
}

location ~* ^/(database\.sql|composer\.(json|lock)|phpinfo\.php|\.env) {
    deny all;
    return 404;
}

# 3) منع تنفيذ أي PHP داخل مجلدات الرفع والكتابة
location ~* ^/(uploads|storage)/.*\.(php|php5|phtml|phar|cgi|pl|py|sh)$ {
    deny all;
    return 404;
}

# 4) تمرير الطلبات إلى index.php (توجيه روابط نظيف)
location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# 5) معالجة PHP
location ~ \.php$ {
    include snippets/fastcgi-php.conf;
    fastcgi_pass unix:/run/php/php8.2-fpm.sock;   # عدّله حسب إصدارك
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    include fastcgi_params;
}

# 6) رؤوس حماية إضافية (مكمّلة لما ترسله المنصة نفسها)
add_header X-Content-Type-Options    "nosniff"           always;
add_header X-Frame-Options           "SAMEORIGIN"        always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
# فعّل HSTS بعد التأكد من عمل الشهادة بشكل كامل:
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# 7) منع الوصول إلى ملفات النسخ والسجلات الشائعة
location ~* \.(bak|old|orig|save|swp|log|sql|md)$ {
    deny all;
    return 404;
}

# 8) تحديد حجم الرفع (يُطابق إعدادات PHP)
client_max_body_size 10M;
