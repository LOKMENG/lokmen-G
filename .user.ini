; إعدادات PHP لملفات الاستضافة التي تعمل بـ PHP-FPM/CGI (لا تُقرأ مع mod_php)
; تُطبَّق على مجلد المشروع وما تحته. عدّل القيم حسب استضافتك.
upload_max_filesize = 10M
post_max_size = 12M
max_execution_time = 120
memory_limit = 256M
display_errors = Off
log_errors = On
expose_php = Off
session.cookie_httponly = On
session.use_strict_mode = On
